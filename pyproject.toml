[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcache-ai"
version = "0.1.0"
description = "Semantic similarity cache for LLM responses (Redis backend, TTL, cost tracking)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tase Nikol", email="anikolaou.ph@gmail.com" }]

dependencies = [
  "redis>=5.0.0",
  "numpy>=1.24",
  "pydantic>=2.6",
]


[project.urls]
Repository = "https://github.com/tase-nikol/promptcache"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6.0",
  "mypy>=1.8",
  "types-redis>=4.6.0.20241004",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build]
exclude = [
  ".testv",
  ".venv",
  "venv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["promptcache*"]